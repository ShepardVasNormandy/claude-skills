name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run checks
        env:
          LEAK_TERMS: ${{ secrets.LEAK_TERMS }}
          LEAK_NAMES: ${{ secrets.LEAK_NAMES }}
          LEAK_ALLOW: ${{ secrets.LEAK_ALLOW }}
          LEAK_PHRASES: ${{ secrets.LEAK_PHRASES }}
        run: bash tests/run.sh && scripts/validate.sh && scripts/check-leaks.sh
